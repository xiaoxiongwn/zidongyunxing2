name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PlayerTemplate.exe (standalone playback engine)
        # This is the bare-bones exe that gets embedded inside MacroRecorder,
        # and is also what "导出独立EXE" copies + appends JSON data to.
        # --manifest: declares Per-Monitor-V2 DPI awareness so recorded and
        #             played-back mouse coordinates match on scaled displays
        run: >
          pyinstaller --onefile --windowed --noupx --clean
          --name PlayerTemplate
          --manifest app.manifest
          player_template.py

      - name: Build MacroRecorder.exe (recorder / editor GUI)
        # --noupx: disable UPX packing (UPX-compressed exes are a very common
        #          antivirus false-positive trigger)
        # --onefile: single portable exe, no external files needed
        # --windowed: no console window pops up behind the GUI
        # --clean: don't reuse a stale build cache
        # --manifest: same DPI-awareness declaration as PlayerTemplate
        # --add-data: bundle PlayerTemplate.exe inside so "导出独立EXE" always
        #             has it available, with no extra files to distribute
        run: >
          pyinstaller --onefile --windowed --noupx --clean
          --name MacroRecorder
          --version-file version_info.txt
          --manifest app.manifest
          --add-data "dist/PlayerTemplate.exe;."
          recorder_gui.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacroRecorder-windows-exe
          path: |
            dist/MacroRecorder.exe
            dist/PlayerTemplate.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacroRecorder.exe
            dist/PlayerTemplate.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
